set deviceconfig system hostname FW-EDGE01
set deviceconfig system login-banner "Authorized access only."
set mgt-config users admin permissions role-based superuser yes
set mgt-config users admin authentication-profile LDAP-PROFILE
set shared password-complexity minimum-length 10
set deviceconfig system service disable-telnet no
set deviceconfig system service disable-ssh no
set shared log-settings syslog SYSLOG-01 server 10.0.0.50
set network interface ethernet ethernet1/1 layer3 ip 192.0.2.2/30
set rulebase security rules ALLOW-WEB from trust to untrust source any destination any application web-browsing action allow
