#config-version=FGT60E-7.0.5-FW-build0304-220914:opmode=0:vdom=0
config system global
    set hostname "FW-BRANCH01"
    set admin-telnet enable
    set admin-ssh-port 22
    set post-login-banner enable
end
config system password-policy
    set status enable
    set minimum-length 12
end
config user radius
    edit "RADIUS-01"
        set server "10.0.0.60"
    next
end
config system admin
    edit "admin"
        set password ENC examplehash
    next
end
config log syslogd setting
    set status enable
    set server "10.0.0.50"
end
config firewall policy
    edit 1
        set srcintf "wan1"
        set dstintf "lan"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
