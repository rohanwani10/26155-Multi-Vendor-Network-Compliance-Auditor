! device: SPINE01 (DCS-7280SR-48C6, EOS-4.28.3M)
!
hostname SPINE01
!
aaa authentication login default local
!
username netadmin privilege 15 secret 5 $1$aaaa$examplehash
!
no aaa root
!
line vty 0 4
 transport input ssh
 login local
!
ip ssh version 2
!
logging host 10.0.0.50
!
banner motd ^C Authorized access only. ^C
!
ip access-list extended MGMT-ACL
 permit tcp 10.0.0.0 0.0.0.255 any eq 22
 deny ip any any
!
end
