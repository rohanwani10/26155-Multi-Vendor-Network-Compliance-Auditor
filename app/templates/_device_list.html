<table id="device-list">
  <thead>
    <tr><th>Filename</th><th>Vendor</th><th>Uploaded</th></tr>
  </thead>
  <tbody>
    {% for device in devices %}
    <tr>
      <td>{{ device.filename }}</td>
      <td>{{ device.vendor }}</td>
      <td>{{ device.uploaded_at }}</td>
    </tr>
    {% else %}
    <tr><td colspan="3">No devices uploaded yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
